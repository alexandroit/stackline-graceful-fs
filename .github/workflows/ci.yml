name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, closure, types, coverage, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage

  upstream:
    name: Exact graceful-fs 4.2.11 suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run test:upstream

  package:
    name: Packed zero-dependency artifact
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - run: sha512sum artifact/*.tgz > artifact/SHA512SUMS
      - run: mkdir consumer
      - run: npm init --yes
        working-directory: consumer
      - run: npm install --ignore-scripts --omit=dev --no-audit --no-fund ../artifact/*.tgz
        working-directory: consumer
      - run: npm ls --all --omit=dev
        working-directory: consumer
      - run: npm audit --omit=dev --audit-level=low
        working-directory: consumer
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > ../artifact/sbom.cdx.json
        working-directory: consumer
      - name: Verify the zero-dependency SBOM
        run: >-
          node -e "const s=require('./artifact/sbom.cdx.json');
          const c=s.components.find(x=>x.name==='@stackline/graceful-fs'&&x.version==='1.0.0');
          const e=c&&s.dependencies.find(x=>x.ref===c['bom-ref']);
          if(s.components.length!==1||!c||!e||e.dependsOn.length)process.exit(1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Node.js ${{ matrix.node }} packed artifact
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.14.0, 16.20.2, 18.20.8, 20.20.2, 22, 24, 26]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - run: mkdir consumer
      - run: npm init --yes
        working-directory: consumer
      - run: npm install --production --ignore-scripts --no-audit --no-fund ../artifact/*.tgz
        working-directory: consumer
      - name: Exercise root and historical deep entry
        run: >-
          node -e "var fs=require('@stackline/graceful-fs');
          var clone=require('@stackline/graceful-fs/clone.js');
          if(typeof fs.readFile!=='function'||typeof fs.gracefulify!=='function'||typeof clone!=='function')process.exit(1)"
        working-directory: consumer
      - name: Exercise Node ESM interoperability
        run: >-
          node --input-type=module -e "import fs from '@stackline/graceful-fs';
          if(typeof fs.readFile!=='function'||typeof fs.gracefulify!=='function')process.exit(1)"
        working-directory: consumer

  platform:
    name: ${{ matrix.os }} filesystem behavior
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run test:packed
      - run: npm run test:closure

  downstream:
    name: ${{ matrix.consumer }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        consumer: [fs-extra, node-gyp, jest, npm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:downstream
        env:
          STACKLINE_DOWNSTREAM: ${{ matrix.consumer }}
